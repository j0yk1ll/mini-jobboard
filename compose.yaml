services:
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      ORIGIN: ${ORIGIN:-http://localhost:3000}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-mini-jobboard-local-only-session-signing-key}
      DATABASE_URL: postgresql://jobboard:jobboard@db:5432/jobboard
      SEED_DEMO: ${SEED_DEMO:-1}
    ports:
      - '127.0.0.1:${APP_PORT:-3000}:3000'

  db:
    image: docker.io/library/postgres:17-alpine
    environment:
      POSTGRES_DB: jobboard
      POSTGRES_USER: jobboard
      POSTGRES_PASSWORD: jobboard
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U jobboard -d jobboard']
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
